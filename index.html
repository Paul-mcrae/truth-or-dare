*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Space Grotesk',system-ui;background:#08080f;color:#fff;min-height:100vh}

.app{max-width:480px;margin:0 auto;min-height:100vh;padding:18px;display:flex;flex-direction:column;position:relative;z-index:1}
.header{text-align:center;padding:18px 0 10px}

.levels{display:flex;gap:8px;overflow-x:auto;padding:14px 0;scrollbar-width:none}

.level.active{background:#fff;color:#000;transform:scale(1.05)}

.level.adult.active{background:linear-gradient(135deg,#7C3AED,#FF0055);color:#fff}
.card{background:linear-gradient(180deg,#1c1c32,#141428);border:1px solid #ffffff12;border-radius:28px;padding:22px;box-shadow:0 20px 60px #0008}
.players-row{display:flex;flex-wrap:wrap;gap:8px;min-height:32px;margin-bottom:14px}
.chip{display:flex;align-items:center;gap:6px;background:#ffffff0f;border:1px solid #ffffff15;padding:7px 14px;border-radius:100px;font-size:13px;font-weight:600}
.chip.active{background:linear-gradient(135deg,#FF0055,#FFCC00);color:#000;font-weight:800}
.input-row{display:flex;gap:10px;margin:14px 0}
.input-row input{flex:1;background:#00000055;border:1px solid #ffffff18;border-radius:14px;padding:14px;color:#fff;font-size:15px;outline:none}
.btn{border:0;border-radius:16px;padding:16px;font-weight:900;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.btn-add{background:#fff;color:#000;min-width:76px}
.btn-truth{flex:1;background:linear-gradient(135deg,#00D4FF,#5B5BFF);color:#fff}
.btn-dare{flex:1;background:linear-gradient(135deg,#FF0055,#FF3D00);color:#fff}
.btn-row{display:flex;gap:12px;margin-top:16px}
.qbox{margin-top:18px;background:#00000066;border-radius:20px;padding:22px;min-height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:1px dashed #ffffff18}
.qbox .type{font-size:10px;letter-spacing:3px;font-weight:900;opacity:.6;margin-bottom:10px}
.qbox .text{font-size:19px;font-weight:700;line-height:1.35}
.qbox .for{font-size:12px;margin-top:12px;background:#ffffff14;padding:5px 12px;border-radius:100px}
.modal{position:fixed;inset:0;background:#000000cc;backdrop-filter:blur(12px);z-index:10;display:none;align-items:center;justify-content:center;padding:18px}
.modal.show{display:flex}
.modal-card{background:#1c1c32;border-radius:24px;padding:24px;max-width:360px;width:100%;text-align:center;border:1px solid #ffffff18}
.footer{margin-top:auto;padding:18px 0 8px;text-align:center;font-size:10px;opacity:.4}
</style>
</head>
<body>
<div class="app">
<div class="header"><div class="logo">TRUTH<br><span>OR DARE</span></div><div class="subtitle">PRO MAX ULTIMATE</div></div>
<div class="levels" id="levels"></div>
<div class="card">
<div class="players-row" id="players"></div>
<div class="input-row"><input id="pname" placeholder="Player name..."><button class="btn btn-add" onclick="addPlayer()">ADD</button></div>
<div class="qbox" id="qbox"><div class="type">READY?</div><div class="text">Add 2+ players, pick level, start chaos!</div></div>
<div class="btn-row"><button class="btn btn-truth" onclick="play('truth')">TRUTH 💎</button><button class="btn btn-dare" onclick="play('dare')">DARE 🔥</button></div>
</div>
<div class="footer">OFFLINE • NO ADS • 18+ FILTERED • VIRAL EDITION</div>
</div>
<div class="modal" id="ageModal"><div class="modal-card"><h2>🔞 ADULT MODE</h2><p style="opacity:.7;margin-top:8px;font-size:14px">18+ spicy content. Are you 18+?</p><div style="display:flex;gap:10px;margin-top:16px"><button class="btn btn-add" style="flex:1" onclick="closeAge(false)">NO, PG</button><button class="btn btn-dare" style="flex:1" onclick="closeAge(true)">YES 18+ 🔥</button></div></div></div>
<script>
const LEVELS=[{id:'soft',label:'😇 SOFT'},{id:'teen',label:'😏 TEEN'},{id:'party',label:'🥳 PARTY'},{id:'spicy',label:'🌶️ SPICY'},{id:'adult',label:'🔞 ADULT'},{id:'savage',label:'💀 SAVAGE'}];
const DATA={
soft:{truth:["Most embarrassing text?","Hidden talent?","Celebrity crush?","Dumbest belief as kid?","Most useless skill?","Worst gift ever?","If invisible for a day?","Biggest ick?","Guilty pleasure song?","Longest no shower?","Worst fashion phase?","Lie to parents?","Awkward date story?","Super strength or speed?","Weirdest dream?"],dare:["15 jumping jacks loudly","Let someone style hair crazy","Best TikTok dance","No 'a' word for 2 rounds","Group sends emoji to your contact","Plank 40 sec","Imitate 3 animals","Shirt backwards 3 rounds","Evil laugh","Alphabet backwards","Mustache drawn","10 squats shouting crush","Post 'I love pickles'"]},
teen:{truth:["Who here would you kiss?","Ever stalked crush?","Biggest turn-off?","Liked 2 people same time?","Flirtiest thing done?","Ever friend-zoned?","Love language?","Most attractive here?","Slid in DMs? What said?","Worst kiss story?","Love at first sight?","Crush on teacher?","Your type?"],dare:["Text crush 'you up?'","Read last 3 DMs aloud","Stare eyes 20 sec","Pickup line to someone","Group chooses who you follow","Flirty wink to all","Heart emoji to 3rd recent chat","Camera roll 10 sec"]},
party:{truth:["Drunkest ever?","Wildest party?","Hooked up at party?","Body count truth?","Blacked out story?","Embarrassing drunk text?","Stolen from party?","Most toxic trait?","Best in bed here?"],dare:["Shot of water dramatic","Water pour on head","Dance on chair 20 sec","Group makes water cocktail","Body shot water off hand","Swap clothing item","Write PARTY on forehead","Chug water 5 sec"]},
spicy:{truth:["Biggest sexual fantasy?","Ever sexted who?","Favorite kiss spot?","One night stand?","Kinkiest tried?","Top or bottom?","Ever sent nudes?","Hottest dream?","Caught doing it?","Wildest hookup location?"],dare:["Lap dance 15 sec clothed","Whisper dirty in ear","Sexy crawl floor","Fake hickey marker","Grind chair 15 sec","Remove 1 item keep underwear","Best moan group rates","Suck finger 5 sec","Playful spank"]},

};
let currentLevel='soft',players=[],current=0,adultUnlocked=false,pending='';
function renderLevels(){let h='';LEVELS.forEach(l=>{h+=`<div class="level ${l.id===currentLevel?'active':''} ${l.id==='spicy'?'spicy':''} ${l.id==='adult'?'adult':''}" onclick="setLevel('${l.id}')">${l.label}</div>`});document.getElementById('levels').innerHTML=h}
function setLevel(id){if((id==='adult'||id==='savage'||id==='spicy')&&!adultUnlocked&&id!=='soft'){pending=id;document.getElementById('ageModal').classList.add('show');return}currentLevel=id;renderLevels();document.getElementById('qbox').innerHTML=`<div class="type">LEVEL: ${id.toUpperCase()}</div><div class="text">Ready for ${id} mode! 🔥</div>`}
function closeAge(ok){document.getElementById('ageModal').classList.remove('show');if(ok){adultUnlocked=true;currentLevel=pending;renderLevels()}}
function addPlayer(){let v=document.getElementById('pname').value.trim();if(!v||players.length>=12)return;players.push(v);document.getElementById('pname').value='';renderPlayers()}
function renderPlayers(){let h='';players.forEach((p,i)=>{h+=`<div class="chip ${i===current?'active':''}">${p} <span onclick="players.splice(${i},1);renderPlayers()" style="cursor:pointer">×</span></div>`});document.getElementById('players').innerHTML=h}
function play(type){if(players.length<2){document.getElementById('qbox').innerHTML=`<div class="type">NEED PLAYERS</div><div class="text">Add 2+ players!</div>`;return}let list=DATA[currentLevel][type];let q=list[Math.floor(Math.random()*list.length)];let player=players[current];document.getElementById('qbox').innerHTML=`<div class="type">${currentLevel.toUpperCase()} • ${type.toUpperCase()}</div><div class="text">${q}</div><div class="for">👉 ${player}</div>`;current=(current+1)%players.length;renderPlayers();if(navigator.vibrate)navigator.vibrate(30)}
document.getElementById('pname').addEventListener('keydown',e=>{if(e.key==='Enter')addPlayer()});
renderLevels();renderPlayers();
</script>
</body>
</html>
