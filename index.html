<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRUTH OR DARE SOCIAL FIXED</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08080f;color:#fff;font-family:system-ui;min-height:100vh}
.app{max-width:500px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:12px;min-height:100vh}
.header{text-align:center;padding:8px}
.logo{font-size:32px;font-weight:900;line-height:.9}
.logo span{background:linear-gradient(90deg,#FF0055,#FFCC00);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.levels{display:flex;gap:6px;overflow-x:auto;padding:8px 0}
.level{flex:0 0 auto;padding:8px 14px;border-radius:99px;background:#ffffff12;border:1px solid #ffffff22;font-size:11px;font-weight:800;cursor:pointer;user-select:none}
.level.active{background:#fff;color:#000}
.wheel-outer{width:300px;height:300px;margin:0 auto;position:relative;border-radius:50%;background:conic-gradient(from 0deg,#FF0055,#FFCC00,#00D4FF,#7C3AED,#FF0055);padding:7px;transition:transform 3.5s cubic-bezier(.2,.8,.2,1)}
.wheel-in{width:100%;height:100%;background:#141428;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center}
.p-item{position:absolute;font-size:12px;font-weight:900;background:#ffffff20;padding:5px 10px;border-radius:99px;transform:translate(-50%,-50%)}
.p-item.active{background:linear-gradient(135deg,#FF0055,#FFCC00);color:#000;box-shadow:0 0 12px #FF005588}
.bottle{font-size:68px;z-index:5;cursor:pointer;transition:transform 3.5s cubic-bezier(.2,.8,.2,1);user-select:none}
.card{background:linear-gradient(180deg,#1e1e38,#141428);border-radius:20px;padding:14px;border:1px solid #ffffff15}
.qbox{background:#00000066;border-radius:14px;padding:14px;min-height:100px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.btn-row{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;border:0;border-radius:12px;padding:13px;font-weight:900;cursor:pointer;font-size:14px}
.btn-t{background:linear-gradient(135deg,#00D4FF,#5B5BFF);color:#fff}
.btn-d{background:linear-gradient(135deg,#FF0055,#FF3D00);color:#fff}
.input{display:flex;gap:6px;margin-bottom:10px}
.input input{flex:1;background:#00000066;border:1px solid #ffffff22;border-radius:10px;padding:10px;color:#fff}
.react-bar{display:flex;gap:8px;justify-content:center;margin:10px 0}
.react{font-size:26px;cursor:pointer;user-select:none;transition:.15s}
.react:active{transform:scale(1.6)}
.chat{height:160px;overflow-y:auto;background:#00000055;border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px}
.msg{background:#ffffff12;padding:7px 10px;border-radius:12px;font-size:13px;max-width:85%}
.msg.me{align-self:flex-end;background:#fff;color:#000;font-weight:700}
.msg.sys{background:#00D4FF22;font-size:11px}
.chat-in{display:flex;gap:6px;margin-top:6px}
.chat-in input{flex:1;background:#ffffff10;border:1px solid #ffffff20;border-radius:99px;padding:10px 14px;color:#fff}
.icon{width:42px;height:42px;border-radius:99px;border:0;background:#ffffff15;font-size:18px;cursor:pointer}
.float{position:fixed;font-size:32px;pointer-events:none;animation:up 1.8s ease forwards;z-index:99}
@keyframes up{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-140px) scale(1.6);opacity:0}}
.topbar{position:fixed;top:10px;right:10px;display:flex;gap:6px;z-index:10}
.topbtn{background:#ffffff15;padding:6px 10px;border-radius:99px;font-size:11px;cursor:pointer;border:0;color:#fff}
</style>
</head>
<body>
<div class="topbar">
<button class="topbtn" id="musicBtn" onclick="toggleMusic()">🎵 Music OFF</button>
</div>
<div class="app">
<div class="header"><div class="logo">TRUTH<br><span>OR DARE</span></div><div style="font-size:9px;letter-spacing:3px;opacity:.5;margin-top:4px">WHEEL + BOTTLE + CHAT + VOICE • ALL ACTIVE</div></div>

<div class="levels" id="lv"></div>

<div class="wheel-outer" id="wheelOuter">
<div class="wheel-in" id="wheelIn">
<div class="bottle"
