<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paul - ULTRA NO CRUSH</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a14;color:#fff;font-family:system-ui;padding:10px}
.app{max-width:360px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
h1{text-align:center;font-size:20px}h1 span{color:#FF0055}
.wheel{width:200px;height:200px;margin:10px auto;border-radius:50%;background:#1a1a3e;border:6px solid #FF0055;display:flex;align-items:center;justify-content:center}
.bottle{font-size:60px;cursor:pointer;transition:transform 3s}
.card{background:#1e1e38;border-radius:12px;padding:10px}
.q{background:#000a;border-radius:10px;padding:10px;min-height:100px;text-align:center;font-size:13px;word-break:break-word;line-height:1.4}
.dec{display:none;margin-top:8px;background:#111;border:2px solid #FFCC00;border-radius:10px;padding:8px}
.dec.show{display:block}
.db{display:flex;gap:6px;margin-top:6px}
.db button{flex:1;border:0;border-radius:10px;padding:12px;font-weight:900;cursor:pointer}
.g{background:#00FF88;color:#000}.r{background:#FF3333;color:#fff}
.btns{display:flex;gap:6px;margin-top:6px}
.btns button{flex:1;border:0;border-radius:10px;padding:12px;font-weight:900;cursor:pointer}
.t{background:#00D4FF;color:#000}.d{background:#FF0055;color:#fff}
.rb{background:#FFCC00;color:#000;width:100%;border:0;border-radius:8px;padding:10px;font-weight:900;margin-top:6px;cursor:pointer}
.list{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.list span{background:#1a1a3e;padding:5px 10px;border-radius:99px;font-size:12px;border:1px solid #FFCC00}
.lead{background:#FFCC0022;border:2px solid #FFCC00;border-radius:8px;padding:8px;font-size:12px}
.lv{display:flex;gap:4px;overflow-x:auto;padding:4px 0}.lv div{flex:0 0 auto;padding:6px 10px;border-radius:99px;background:#222;font-size:10px;font-weight:800;cursor:pointer}.lv div.on{background:#fff;color:#000}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000c;align-items:center;justify-content:center;padding:12px;z-index:10}.modal.show{display:flex}.mcard{background:#1a1a3e;border:3px solid #FFCC00;border-radius:14px;padding:14px;width:100%;max-width:320px;text-align:center}
</style></head><body>
<div class="app">
<h1>PAUL'S TRUTH <span>OR DARE</span></h1>
<div style="text-align:center;font-size:10px;opacity:.7">✅ ULTRA LIGHT - NO DOTS - NO CRUSH - AWARD WORKS - CLEAR Q</div>
<div style="background:#1a1a3e;border:1px solid #FFCC00;border-radius:8px;padding:8px;display:flex;justify-content:space-between;font-size:11px;font-weight:800"><span id="clk">--:--</span><span id="pts">0 pts</span></div>
<div style="background:#111;border:2px solid #FFCC00;border-radius:10px;padding:8px;text-align:center">
<div class="list" id="plist"></div>
<div id="board" class="lead">Add 2 players to start! No crush!</div>
<button class="rb" onclick="showRank()">🏆 RANKING</button>
</div>
<div class="wheel"><div class="bottle" id="bot" onclick="spin()">🍾</div></div>
<button class="rb" style="background:#fff;color:#000" onclick="spin()">🎡 SPIN BOTTLE</button>
<div class="lv" id="lv"></div>
<div class="card">
<div style="display:flex;gap:4px">
<input id="pn" placeholder="Your name" style="flex:1;padding:10px;border-radius:6px;border:1px solid #444;background:#0006;color:#fff">
<button onclick="addP()" style="padding:10px 12px;border-radius:6px;border:0;background:#fff;color:#000;font-weight:900">ADD ME</button>
</div>
<div class="q" id="qm">ULTRA LIGHT! Add 2+ players → Spin → Truth/Dare → Award! No dots = No crush! Questions clear!</div>
<div class="dec" id="dec">
<div id="dt" style="font-weight:900;font-size:12px">Did player answer well?</div>
<div id="dq" style="font-size:12px;margin:6px 0;background:#0006;padding:8px;border-radius:6px;word-break:break-word"></div>
<div class="db">
<button class="g" onclick="award()">🟢 AWARD +10</button>
<button class="r" onclick="deduct()">🔴 DEDUCT -5</button>
</div>
</div>
<div class="btns">
<button class="t" onclick="play('truth')">TRUTH +10</button>
<button class="d" onclick="play('dare')">DARE +5</button>
</div>
<div style="display:flex;gap:4px;margin-top:6px">
<button class="rb" style="background:#fff;color:#000;flex:1" onclick="showRank()">🏆 RANK</button>
<button class="rb" style="background:#FF0055;color:#fff;flex:1" onclick="resetG()">🔄 RESET</button>
<button class="rb" style="background:#25D366;color:#fff;flex:1" onclick="shareW()">📲 SHARE</button>
</div>
</div>
</div>
<div class="modal" id="rm"><div class="mcard"><h3 style="color:#FFCC00">RANKING</h3><div id="rc" style="margin-top:10px;text-align:left;font-size:12px"></div><button onclick="closeR()" style="margin-top:10px;width:100%;padding:10px;border-radius:8px;border:0;background:#333;color:#fff;font-weight:900">CLOSE</button></div></div>
<script>
var players=[],curr=0,rot=0,pend=-1,pendT='',curL=2;
var LEVELS=['SOFT','TEEN','PARTY','SPICY','ADULT','SAVAGE'];
var Q={
0:{t:["What is the most embarrassing text you ever sent by mistake? Who did you send it to?","Do you have a hidden talent nobody knows? Explain it clearly.","What worst lie did you tell today and why did you tell it?"],d:["Do 15 jumping jacks while shouting your name loudly.","Dance 10 seconds with no music so everyone sees you."]},
1:{t:["Who would you kiss right now in this room if nobody would judge you? Say the name.","Do you have a crush on someone in this room? Who and why?","Who is most attractive here right now and what makes them attractive?"],d:["Text your crush 'you up?' now and show everyone you sent it.","Let group write your WhatsApp status for 1 hour."]},
2:{t:["What is your drunkest story ever? Where were you and what happened?","What is your body count honestly? Tell truth if comfortable.","What worst thing did you do when drunk that you regret?"],d:["Drink 3 glasses of water very quickly one after another.","Do water shot like alcohol in one gulp loudly."]},
3:{t:["What is your biggest fantasy you never told anyone? Explain clearly.","Who here do you find very hot and what makes them attractive?","Who is hottest you ever kissed and what made it memorable?"],d:["Give lap dance to a chair for 15 seconds, make it funny.","Twerk 20 seconds continuously so everyone sees clearly."]},
4:{t:["What is your dirtiest secret you never told anyone? Be honest now.","How did you lose virginity? Where, who, how did you feel?","How many people have you kissed in life? Give real number honestly."],d:["Twerk 30 seconds non-stop while everyone watches clearly.","Show your last search history for 5 seconds to everyone."]},
5:{t:["Who would you unfriend right now? Who and why clearly?","Who is most fake here pretending to be nice but not real? Why?","Who talks behind others backs most? Give example."],d:["Post 'I am a liar' on WhatsApp status for 10 minutes.","Give phone to group for 2 minutes, they can look at anything."]}
};
function tick(){try{document.getElementById('clk').textContent=new Date().toLocaleTimeString();}catch(e){}}
setInterval(tick,1000);tick();
function renderLv(){var h='';for(var i=0;i<LEVELS.length;i++){h+='<div class="'+(i==curL?'on':'')+'" onclick="curL='+i+';renderLv()">'+LEVELS[i]+'</div>';}document.getElementById('lv').innerHTML=h;}
function render(){
var el=document.getElementById('plist');el.innerHTML='';var tot=0;
for(var i=0;i<players.length;i++){tot+=players[i].points;var s=document.createElement('span');s.textContent=players[i].name+' '+players[i].points+'pts';if(i==curr){s.style.background='#FFCC00';s.style.color='#000';}el.appendChild(s);}
document.getElementById('pts').textContent=tot+' pts';
var b=document.getElementById('board');if(players.length==0){b.textContent='Add players! No crush version!';return;}
var sorted=players.slice().sort(function(a,b){return b.points-a.points;});
var h='LEADERBOARD<br>';for(var i=0;i<sorted.length;i++){h+='<div style="display:flex;justify-content:space-between"><span>'+(i+1)+'. '+sorted[i].name+'</span><span>'+sorted[i].points+' pts</span></div>';}
b.innerHTML=h;
}
function addP(){
var v=document.getElementById('pn').value.trim();if(!v)return;
players.push({name:v,points:0});document.getElementById('pn').value='';render();
}
function spin(){
if(players.length<2){document.getElementById('qm').textContent='Need 2+ players to spin! Add more players first!';return;}
var bot=document.getElementById('bot');var picked=Math.floor(Math.random()*players.length);
var finalRot=rot+5*360+Math.random()*360;bot.style.transform='rotate('+finalRot+'deg)';rot=finalRot;
document.getElementById('qm').textContent='Spinning fast then slow... Please wait...';document.getElementById('dec').className='dec';
setTimeout(function(){curr=picked;render();document.getElementById('qm').innerHTML='🎯 '+players[curr].name+' PICKED!<br>Choose Truth +10 or Dare +5!';},3000);
}
function play(type){
if(players.length<2)return;
var q=Q[curL][type][Math.floor(Math.random()*Q[curL][type].length)];pend=curr;pendT=type;var pts=type=='truth'?10:5;
document.getElementById('qm').innerHTML='<div style="font-size:11px;opacity:.7">'+LEVELS[curL]+' '+type+' '+pts+'pts - Clear:</div><div style="font-weight:800;margin-top:6px;line-height:1.4">'+q+'</div><div style="margin-top:6px">👉 '+players[pend].name+' answer clearly!</div>';document.getElementById('dt').textContent='Did '+players[pend].name+' answer well?';document.getElementById('dq').textContent=q;document.getElementById('dec').className='dec show';render();
}
function award(){
if(pend<0)return;var pts=pendT=='truth'?10:5;players[pend].points+=pts;document.getElementById('qm').innerHTML='🟢 AWARDED +'+pts+'! Total '+players[pend].points+' pts!';document.getElementById('dec').className='dec';curr=(curr+1)%players.length;render();pend=-1;
}
function deduct(){
if(pend<0)return;players[pend].points+=-5;document.getElementById('qm').innerHTML='🔴 DEDUCTED -5! Total '+players[pend].points+' pts!';document.getElementById('dec').className='dec';curr=(curr+1)%players.length;render();pend=-1;
}
function showRank(){
if(players.length==0)return;
var sorted=players.slice().sort(function(a,b){return b.points-a.points;});
var html='';for(var i=0;i<sorted.length;i++){html+='<div style="padding:6px;background:'+(i==0?'#FFCC00;color:#000':'#222')+';border-radius:6px;margin:3px 0;display:flex;justify-content:space-between"><span>'+(i+1)+'. '+sorted[i].name+'</span><span>'+sorted[i].points+' pts</span></div>';}
document.getElementById('rc').innerHTML=html;document.getElementById('rm').className='modal show';
}
function closeR(){document.getElementById('rm').className='modal';}
function resetG(){for(var i=0;i<players.length;i++)players[i].points=0;render();document.getElementById('qm').textContent='New game! Points reset!';}
function shareW(){
if(players.length==0)return;
var txt='🏆 TRUTH OR DARE!%0A';for(var i=0;i<players.length;i++){txt+=(i+1)+'. '+players[i].name+' '+players[i].points+' pts%0A';}
window.open('https://wa.me/?text='+txt,'_blank');
}
renderLv();render();
</script>
</body></html>
