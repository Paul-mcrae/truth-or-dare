<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>TRUTH OR DARE PRO MAX</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0f0f1f;color:#fff;font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px;background:radial-gradient(ellipse at top,#2a0a2a,#0f0f1f 70%)}.card{width:100%;max-width:420px;background:linear-gradient(145deg,#1e1e3a,#1a1a2e);border-radius:28px;padding:24px;border:1px solid #ffffff18;box-shadow:0 20px 60px #0008;text-align:center}h1{font-size:28px;font-weight:900;background:linear-gradient(90deg,#ff006a,#ffcc00);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.badge{display:inline-block;background:#ffffff14;padding:4px 12px;border-radius:99px;font-size:11px;margin:8px 0 18px}.player-input{display:flex;gap:8px;margin:14px 0}.player-input input{flex:1;background:#ffffff0d;border:1px solid #ffffff1f;border-radius:12px;padding:12px;color:#fff}.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:800;font-size:15px;cursor:pointer;width:100%}.btn-add{background:#ffffff14;color:#fff}.btn-truth{background:linear-gradient(135deg,#00d4ff,#0066ff);color:#fff;margin-bottom:10px}.btn-dare{background:linear-gradient(135deg,#ff006a,#ff3c00);color:#fff}.question-box{min-height:130px;background:#0000004d;border-radius:18px;display:flex;align-items:center;justify-content:center;padding:18px;font-size:18px;margin:18px 0;border:1px dashed #ffffff1a}.players{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.chip{background:#ffffff14;padding:6px 12px;border-radius:99px;font-size:13px}.chip.active{background:linear-gradient(135deg,#ff006a,#ffcc00);color:#000;font-weight:800}</style></head><body><div class="card"><h1>TRUTH OR DARE</h1><div style="font-weight:900;letter-spacing:3px;color:#ff006a">PRO MAX</div><div class="badge">ULTIMATE OFFLINE • GITHUB</div><div class="player-input"><input id="pname" placeholder="Enter player name"><button class="btn btn-add" style="width:auto" onclick="addPlayer()">Add</button></div><div class="players" id="players"></div><div class="question-box" id="qbox">Add 2+ players to start!</div><button class="btn btn-truth" onclick="ask('truth')">TRUTH 💎</button><button class="btn btn-dare" onclick="ask('dare')">DARE 🔥</button><div style="font-size:11px;opacity:.6;margin-top:14px">✅ 100% Offline • No PRO Needed</div></div><script>let players=[],current=0;const truths=["What's the most embarrassing thing you've done?","Have you ever lied to your best friend?","What's your biggest fear?","Who do you have a crush on?","What's the worst date?","Have you ever cheated on test?","What's a secret never told?","Rich or famous?","Most useless talent?","Have you ghosted someone?","Last lie you told?","Change one thing about you?","Guilty pleasure?","First kiss?","Weirdest dream?","Ever stolen?","Biggest insecurity?","Kiss person to left?","Most childish thing still do?","If you could date anyone here who?"];const dares=["Do 10 pushups!","Group post on your status","Dance 30 sec crazy","Accent for 3 rounds","Show last 5 gallery photos","Call crush say hi","Impression of someone here","Face drawing","Eat chili spoon","Do worm dance","Sing loudly","Animal for 1 min","Socks on hands 3 rounds","Group choose profile pic","20 squats","Lick elbow try","Tell joke, if no laugh repeat","Model walk","Plank 30 sec","Swap clothes next person"];function addPlayer(){let v=document.getElementById('pname').value.trim();if(!v)return;players.push(v);document.getElementById('pname').value='';render()}function render(){let h='';players.forEach((p,i)=>{h+=`<div class="chip ${i==current?'active':''}">${p}</div>`});document.getElementById('players').innerHTML=h;document.getElementById('qbox').innerHTML=players.length<2?'Add '+(2-players.length)+' more!':`${players[current]}'s turn!`}function ask(t){if(players.length<2){document.getElementById('qbox').innerHTML='Need 2 players!';return}let list=t=='truth'?truths:dares;let q=list[Math.floor(Math.random()*list.length)];document.getElementById('qbox').innerHTML=`<div><small>${t.toUpperCase()} for ${players[current]}</small><br><b>${q}</b></div>`;current=(current+1)%players.length;setTimeout(render,2500)}document.getElementById('pname').addEventListener('keydown',e=>{if(e.key==='Enter')addPlayer()})</script></body></html>
