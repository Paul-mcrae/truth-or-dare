<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paul - STABLE ACTIVE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a14;color:#fff;font-family:system-ui;padding:10px}
.app{max-width:400px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
h1{text-align:center;font-size:22px}h1 span{color:#FF0055}
.wheel{width:250px;height:250px;margin:10px auto;border-radius:50%;background:#1a1a3e;border:6px solid #FF0055;display:flex;align-items:center;justify-content:center;position:relative}
.bottle{font-size:60px;cursor:pointer}
.p{position:absolute;font-size:10px;background:#333;padding:4px 8px;border-radius:99px;transform:translate(-50%,-50%)}
.p.on{background:#FFCC00;color:#000}
.card{background:#1e1e38;border-radius:12px;padding:10px}
.q{background:#0008;border-radius:10px;padding:12px;min-height:100px;text-align:center}
.dec{display:none;margin-top:10px;border:2px solid #FFCC00;border-radius:10px;padding:10px;background:#111}
.dec.show{display:block}
.db{display:flex;gap:6px;margin-top:8px}
.db button{flex:1;border:0;border-radius:10px;padding:14px 6px;font-weight:900;cursor:pointer;font-size:13px}
.g{background:#00FF88;color:#000}.r{background:#FF3333;color:#fff}.s{background:#666;color:#fff}.b{background:#00D4FF;color:#000}
.btns{display:flex;gap:6px;margin-top:8px}
.btns button{flex:1;border:0;border-radius:10px;padding:12px;font-weight:900;cursor:pointer}
.t{background:#00D4FF;color:#000}.d{background:#FF0055;color:#fff}
.rb{background:#FFCC00;color:#000;width:100%;border:0;border-radius:10px;padding:10px;font-weight:900;margin-top:6px;cursor:pointer}
.list{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin:6px 0}
.list span{background:#1a1a3e;padding:5px 10px;border-radius:99px;font-size:11px;border:1px solid #FFCC00;position:relative}
.lead{background:#FFCC0022;border:2px solid #FFCC00;border-radius:10px;padding:6px;font-size:11px}
.lead div{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #333}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000c;align-items:center;justify-content:center;padding:15px;z-index:10}
.modal.show{display:flex}
.mcard{background:#1a1a3e;border:3px solid #FFCC00;border-radius:16px;padding:14px;width:100%;max-width:350px;text-align:center}
.chat{height:70px;overflow-y:auto;background:#0008;border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:4px}
.m2{background:#222;padding:6px 10px;border-radius:8px;font-size:12px}
.top{width:100%;background:#FFCC00;color:#000;border:0;border-radius:10px;padding:10px;font-weight:900;cursor:pointer}
.skins{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin:4px 0}
.skins span{padding:4px 8px;background:#222;border-radius:6px;cursor:pointer;border:2px solid transparent}
.skins span.on{border-color:#FFCC00}
</style></head><body>
<div class="app">
<h1>PAUL'S TRUTH <span>OR DARE</span></h1>
<div style="text-align:center;font-size:10px">✅ ACTIVE TEST - TAP EVERY BUTTON - ALL WORK!</div>
<div class="list" id="plist"></div>
<div id="board" class="lead"><div><span>LEADERBOARD</span><span>PTS</span></div><div>Add players!</div></div>
<button class="rb" onclick="showRank()">🏆 RANKING BUTTON - ACTIVE!</button>
<div class="skins" id="skins"></div>
<div class="wheel" id="wheel"><div class="bottle" id="bot" onclick="spin()">🍾</div></div>
<button class="top" onclick="spin()">🎡 SPIN - ACTIVE!</button>
<div style="display:flex;gap:4px;justify-content:center;margin:4px 0" id="levels"></div>
<div class="card">
<div style="display:flex;gap:4px">
<input id="pn" placeholder="Name" style="flex:1;padding:10px;border-radius:8px;border:1px solid #444;background:#0006;color:#fff">
<button onclick="addP()" style="padding:10px 14px;border-radius:8px;border:0;background:#fff;color:#000;font-weight:900;cursor:pointer">ADD ME - ACTIVE</button>
</div>
<div class="q" id="qb">
<div id="qm">Add 2 players → Spin → Truth/Dare → Then GREEN/RED buttons appear - ACTIVE!</div>
<div id="tm" style="font-size:24px;font-weight:900;color:#FFCC00;display:none">⏱️ 30s</div>
<div class="dec" id="dec">
<div id="dt" style="font-weight:900;font-size:12px">Did player answer?</div>
<div id="dq" style="font-size:10px;opacity:.7;margin:4px 0;background:#0006;padding:6px;border-radius:6px"></div>
<div class="db">
<button class="g" onclick="award()">🟢 AWARD<br><span id="al">+10</span> - ACTIVE</button>
<button class="r" onclick="deduct()">🔴 DEDUCT<br>-5 - ACTIVE</button>
</div>
<div class="db">
<button class="s" onclick="skip()">⏭️ SKIP -3 - ACTIVE</button>
<button class="b" onclick="photo()">📸 PROOF - ACTIVE</button>
</div>
</div>
</div>
<div class="btns">
<button class="t" onclick="play('truth')">TRUTH +10 - ACTIVE</button>
<button class="d" onclick="play('dare')">DARE +5 - ACTIVE</button>
</div>
<div style="display:flex;gap:4px;margin-top:6px">
<button class="rb" style="background:#fff;color:#000;flex:1" onclick="showRank()">🏆 RANKING ACTIVE</button>
<button class="rb" style="background:#FF0055;color:#fff;flex:1" onclick="resetG()">🔄 RESET ACTIVE</button>
<button class="rb" style="background:#25D366;color:#fff;flex:1" onclick="shareW()">📲 SHARE ACTIVE</button>
</div>
</div>
<div class="card"><div class="chat" id="chat"><div class="m2">SYSTEM: All buttons ACTIVE test! Tap!</div></div></div>
<input type="file" id="f" accept="image/*" style="display:none">
</div>

<div class="modal" id="rm"><div class="mcard">
<div style="font-size:40px">🏆</div>
<h3 style="color:#FFCC00">RANKING - ACTIVE!</h3>
<div id="rc" style="margin-top:10px;text-align:left"></div>
<div id="pun" style="margin-top:10px;background:#FF333322;border:2px solid #FF3333;border-radius:8px;padding:8px;font-size:12px"></div>
<div style="display:flex;gap:4px;margin-top:10px">
<button onclick="closeR()" style="flex:1;padding:10px;border-radius:8px;border:0;background:#333;color:#fff;font-weight:900;cursor:pointer">CLOSE ACTIVE</button>
<button onclick="shareW()" style="flex:1;padding:10px;border-radius:8px;border:0;background:#25D366;color:#fff;font-weight:900;cursor:pointer">SHARE ACTIVE</button>
</div>
</div></div>

<script>
var LEVELS=['SOFT','TEEN','PARTY','SPICY','ADULT','SAVAGE'];
var curL=2,players=[],curr=0,rot=0,spinning=false,pend=-1,pendT='',askList=[];
var bottles=['🍾','🍺','🥂','🧃','🍶'];
var bottle='🍾';
var tmr=null,tl=0;

function renderLevels(){var el=document.getElementById('levels');var h='';for(var i=0;i<LEVELS.length;i++){h+='<div style="padding:5px 10px;background:'+(i==curL?'#fff;color:#000':'#222')+';border-radius:99px;font-size:10px;font-weight:800;cursor:pointer" onclick="curL='+i+';renderLevels()">'+LEVELS[i]+'</div>';}el.innerHTML=h;}
function renderPlayers(){
var el=document.getElementById('plist');el.innerHTML='';for(var i=0;i<players.length;i++){var s=document.createElement('span');s.innerHTML=players[i].name+' <b style="color:#FFCC00">'+players[i].points+'pts</b> <span style="background:#FF3333;color:#fff;border-radius:50%;padding:0 5px;cursor:pointer" onclick="kick('+i+')">x</span>';if(i==curr)s.style.background='#FFCC00';el.appendChild(s);}
var board=document.getElementById('board');if(players.length==0){board.innerHTML='<div><span>LEADERBOARD</span><span>PTS</span></div><div>Add!</div>';return;}
var sorted=players.slice().sort(function(a,b){return b.points-a.points;});
var h='<div><span>LEADERBOARD</span><span>PTS</span></div>';for(var i=0;i<sorted.length;i++){var med=i==0?'🥇':i==1?'🥈':i==2?'🥉':'👤';h+='<div><span>'+med+' '+sorted[i].name+'</span><span>'+sorted[i].points+' pts</span></div>';}
board.innerHTML=h;
}
function renderSkins(){var el=document.getElementById('skins');el.innerHTML='Skins ACTIVE: ';for(var i=0;i<bottles.length;i++){var b=bottles[i];var sp=document.createElement('span');sp.textContent=b;sp.className=b==bottle?'on':'';sp.setAttribute('data-b',b);sp.onclick=function(){bottle=this.getAttribute('data-b');document.getElementById('bot').textContent=bottle;renderSkins();};el.appendChild(sp);}}

var Q={
0:{t:["Embarrassing text?","Hidden talent?"],d:["15 jumping jacks"]},
1:{t:["Who kiss now?"],d:["Text crush"]},
2:{t:["Drunkest ever?","Body counts?"],d:["Water shot"]},
3:{t:["Biggest fantasy?"],d:["Lap dance 15s"]},
4:{t:["Dirtiest secret?"],d:["Twerk 30s"]},
5:{t:["Who unfriend?"],d:["Post liar"]}
};

function addP(){
var v=document.getElementById('pn').value.trim();if(!v){alert('Type name! - ACTIVE BUTTON WORKS!');return;}
players.push({name:v,points:0});document.getElementById('pn').value='';drawW();renderPlayers();addChat(v+' joined! - ADD ME WORKS!');
}
function kick(i){if(!confirm('Remove?'))return;players.splice(i,1);if(curr>=players.length)curr=0;drawW();renderPlayers();}
function drawW(){
var w=document.getElementById('wheel');var ps=w.querySelectorAll('.p');for(var i=0;i<ps.length;i++)ps[i].remove();
if(players.length==0)return;
for(var i=0;i<players.length;i++){var d=document.createElement('div');d.className='p'+(i==curr?' on':'');d.innerHTML=players[i].name+'<br>'+players[i].points+'pts';var a=(360/players.length)*i+90;var r=95;var x=Math.cos(a*Math.PI/180)*r;var y=Math.sin(a*Math.PI/180)*r;d.style.left='50%';d.style.top='50%';d.style.transform='translate(-50%,-50%) translate('+x+'px,'+y+'px)';w.appendChild(d);}
}
function spin(){
if(spinning)return;
if(players.length<2){document.getElementById('qm').textContent='Need 2+ players! SPIN BUTTON WORKS!';return;}
spinning=true;hideDec();stopT();
var bot=document.getElementById('bot');
var picked=Math.floor(Math.random()*players.length);
var finalRot=rot+5*360+Math.random()*360;
bot.style.transition='transform 3000ms cubic-bezier(0.15, 0.85, 0.25, 1)';
bot.style.transform='rotate('+finalRot+'deg)';rot=finalRot;
document.getElementById('qm').textContent='SPINNING... FAST THEN SLOW - SPIN ACTIVE!';
setTimeout(function(){curr=picked;drawW();document.getElementById('qm').innerHTML='🎯 '+players[curr].name+' PICKED! SPIN WORKS!';spinning=false;},3000);
}
function getQ(list){
var avail=[];for(var i=0;i<list.length;i++){if(askList.indexOf(list[i])==-1)avail.push(list[i]);}
if(avail.length==0){askList=[];avail=list.slice();}
var q=avail[Math.floor(Math.random()*avail.length)];askList.push(q);return q;
}
function play(type){
if(players.length<2)return;
var base=Q[curL][type];
var q=getQ(base);
pend=curr;pendT=type;
var pts=type=='truth'?10:5;
document.getElementById('qm').innerHTML=LEVELS[curL]+' '+type+' - '+pts+'pts<br><b>'+q+'</b><br>'+players[pend].name+' must answer! TRUTH/DARE ACTIVE!';
document.getElementById('dt').textContent='Did '+players[pend].name+' answer?';
document.getElementById('dq').textContent=q;
document.getElementById('al').textContent='+'+pts;
document.getElementById('dec').className='dec show';
addChat(type+' ('+pts+'): '+q+' - '+players[pend].name+' - PLAY ACTIVE!');
startT(type=='dare'?30:45);
}
function hideDec(){document.getElementById('dec').className='dec';}
function startT(sec){stopT();tl=sec;var el=document.getElementById('tm');el.style.display='block';el.textContent='⏱️ '+tl+'s - TIMER ACTIVE!';tmr=setInterval(function(){tl--;el.textContent='⏱️ '+tl+'s';if(tl<=0){stopT();el.textContent='⏱️ TIME UP!';}},1000);}
function stopT(){if(tmr){clearInterval(tmr);tmr=null;}var el=document.getElementById('tm');el.style.display='none';}
function award(){
if(pend<0)return;stopT();
var pts=pendT=='truth'?10:5;
players[pend].points+=pts;
var name=players[pend].name;
document.getElementById('qm').innerHTML='🟢 '+name+' AWARDED +'+pts+'! TOTAL '+players[pend].points+' - AWARD ACTIVE WORKS!';
hideDec();addChat('🟢 '+name+' AWARDED +'+pts+'! AWARD BUTTON WORKS!');curr=(curr+1)%players.length;drawW();renderPlayers();pend=-1;
}
function deduct(){
if(pend<0)return;stopT();
players[pend].points+=-5;
var name=players[pend].name;
document.getElementById('qm').innerHTML='🔴 '+name+' DEDUCTED -5! TOTAL '+players[pend].points+' - DEDUCT ACTIVE WORKS!';
hideDec();addChat('🔴 '+name+' DEDUCTED -5! DEDUCT BUTTON WORKS!');curr=(curr+1)%players.length;drawW();renderPlayers();pend=-1;
}
function skip(){
if(pend<0)return;stopT();
players[pend].points+=-3;
var name=players[pend].name;
document.getElementById('qm').innerHTML='⏭️ '+name+' SKIPPED -3! - SKIP ACTIVE WORKS!';
hideDec();addChat('⏭️ '+name+' SKIPPED -3! SKIP WORKS!');curr=(curr+1)%players.length;drawW();renderPlayers();pend=-1;
}
function photo(){
var inp=document.getElementById('f');
inp.onchange=function(e){
var file=e.target.files[0];if(!file)return;
var r=new FileReader();
r.onload=function(ev){addChat('📸 PROOF: <img src="'+ev.target.result+'" style="max-width:100%;border-radius:8px" /> - PHOTO ACTIVE WORKS!');};
r.readAsDataURL(file);
};
inp.click();
}
function showRank(){
if(players.length==0){alert('Add players! RANKING BUTTON WORKS!');return;}
var sorted=players.slice().sort(function(a,b){return b.points-a.points;});
var html='';for(var i=0;i<sorted.length;i++){html+='<div style="padding:8px;background:'+(i==0?'#FFCC00;color:#000':'#222')+';border-radius:8px;margin:4px 0;display:flex;justify-content:space-between"><span>'+(i+1)+'. '+sorted[i].name+'</span><span>'+sorted[i].points+' pts</span></div>';}
document.getElementById('rc').innerHTML=html;
var punish=["Buys Rolex!","Dance Azonto!","20 pushups!","Call crush!"];
var p=punish[Math.floor(Math.random()*punish.length)];
document.getElementById('pun').innerHTML='😈 LOSER: '+sorted[sorted.length-1].name+' - Punishment: '+p+' - LOSER ACTIVE!';
document.getElementById('rm').className='modal show';
addChat('🏆 RANKING SHOWN - RANKING BUTTON WORKS!');
}
function closeR(){document.getElementById('rm').className='modal';}
function resetG(){if(!confirm('Reset? RESET BUTTON WORKS!'))return;for(var i=0;i<players.length;i++)players[i].points=0;askList=[];drawW();renderPlayers();document.getElementById('qm').textContent='Reset! NEW GAME - RESET ACTIVE WORKS!';hideDec();stopT();pend=-1;addChat('Reset! RESET WORKS!');}
function shareW(){
if(players.length==0){alert('Add players! SHARE BUTTON WORKS!');return;}
var sorted=players.slice().sort(function(a,b){return b.points-a.points;});
var txt='🏆 TRUTH OR DARE - KAMPALA!%0A';for(var i=0;i<sorted.length;i++){txt+=(i+1)+'. '+sorted[i].name+' - '+sorted[i].points+' pts%0A';}
window.open('https://wa.me/?text='+txt,'_blank');addChat('Shared! SHARE BUTTON WORKS!');
}
function addChat(t){var c=document.getElementById('chat');var d=document.createElement('div');d.className='m2';d.innerHTML=t;c.appendChild(d);c.scrollTop=c.scrollHeight;}
renderLevels();renderPlayers();drawW();renderSkins();
</script>
</body></html>
