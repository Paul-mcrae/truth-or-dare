<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paul - ALL ALIVE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a14;color:#fff;font-family:system-ui;padding:8px}
.app{max-width:400px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
h1{text-align:center;font-size:22px}h1 span{color:#FF0055}
.wheel{width:240px;height:240px;margin:10px auto;border-radius:50%;background:#1a1a3e;border:6px solid #FF0055;position:relative;display:flex;align-items:center;justify-content:center}
.bottle{font-size:60px;cursor:pointer;transition:transform 3s cubic-bezier(0.15,0.85,0.25,1)}
.p{position:absolute;font-size:10px;background:#333;padding:4px 8px;border-radius:99px;transform:translate(-50%,-50%)}
.p.on{background:#FFCC00;color:#000}
.card{background:#1e1e38;border-radius:12px;padding:8px}
.q{background:#0009;border-radius:10px;padding:10px;min-height:90px;text-align:center}
.dec{display:none;margin-top:8px;background:#111;border:2px solid #FFCC00;border-radius:10px;padding:8px}
.dec.show{display:block}
.db{display:flex;gap:5px;margin-top:6px}
.db button{flex:1;border:0;border-radius:10px;padding:12px;font-weight:900;cursor:pointer}
.g{background:#00FF88;color:#000}.r{background:#FF3333;color:#fff}.s{background:#888;color:#fff}.bl{background:#00D4FF;color:#000}
.btns{display:flex;gap:5px;margin-top:6px}
.btns button{flex:1;border:0;border-radius:10px;padding:11px;font-weight:900;cursor:pointer}
.t{background:#00D4FF;color:#000}.d{background:#FF0055;color:#fff}
.rb{background:#FFCC00;color:#000;width:100%;border:0;border-radius:8px;padding:9px;font-weight:900;margin-top:4px;cursor:pointer}
.list{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.list span{background:#1a1a3e;padding:4px 8px;border-radius:99px;font-size:11px;border:1px solid #FFCC00}
.lead{background:#FFCC0022;border:2px solid #FFCC00;border-radius:8px;padding:6px;font-size:11px}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000c;align-items:center;justify-content:center;padding:12px;z-index:10}
.modal.show{display:flex}
.mcard{background:#1a1a3e;border:3px solid #FFCC00;border-radius:14px;padding:12px;width:100%;max-width:340px;text-align:center}
.timer{font-size:20px;font-weight:900;color:#FFCC00;display:none}.timer.show{display:block}
</style></head><body>
<div class="app">
<h1>PAUL'S TRUTH <span>OR DARE</span></h1>
<div style="text-align:center;font-size:10px;opacity:.7">✅ ALL ALIVE v9999 - NO INACTIVE</div>
<div class="bar" style="background:#1a1a3e;border:1px solid #FFCC00;border-radius:8px;padding:8px;display:flex;justify-content:space-between;font-size:11px;font-weight:800"><span id="clk">--:--</span><span id="pts">0 pts</span></div>
<div class="online" style="background:#111;border:2px solid #FFCC00;border-radius:10px;padding:8px;text-align:center">
<div class="list" id="plist"></div>
<div id="board" class="lead">Add players to start!</div>
<button class="rb" onclick="showRank()">🏆 RANKING + LOSER PUNISHMENT - ALIVE</button>
</div>
<div class="wheel" id="wheel"><div class="bottle" id="bot" onclick="spin()">🍾</div></div>
<button class="rb" style="background:#fff;color:#000" onclick="spin()">🎡 SPIN - ALIVE - FAST THEN SLOW</button>
<div style="display:flex;gap:4px;overflow-x:auto;padding:4px 0" id="lv"></div>
<div class="card">
<div style="display:flex;gap:4px">
<input id="pn" placeholder="Your name" style="flex:1;padding:10px;border-radius:6px;border:1px solid #444;background:#0006;color:#fff">
<button onclick="addP()" style="padding:10px 14px;border-radius:6px;border:0;background:#fff;color:#000;font-weight:900;cursor:pointer">ADD ME - ALIVE</button>
</div>
<div class="q">
<div id="qm">Add 2+ players → Spin → Truth/Dare → Award/Deduct - ALL ALIVE!</div>
<div class="timer" id="tm">⏱️ 30s - TIMER ALIVE</div>
<div class="dec" id="dec">
<div id="dt" style="font-weight:900">Did player answer?</div>
<div id="dq" style="font-size:11px;margin:4px 0;background:#0006;padding:6px;border-radius:6px"></div>
<div class="db">
<button class="g" onclick="award()">🟢 AWARD +10 - ALIVE</button>
<button class="r" onclick="deduct()">🔴 DEDUCT -5 - ALIVE</button>
</div>
<div class="db">
<button class="s" onclick="skip()">⏭️ SKIP -3 - ALIVE</button>
<button class="bl" onclick="photo()">📸 PROOF - ALIVE</button>
</div>
</div>
</div>
<div class="btns">
<button class="t" onclick="play('truth')">TRUTH +10 - ALIVE</button>
<button class="d" onclick="play('dare')">DARE +5 - ALIVE</button>
</div>
<div style="display:flex;gap:4px;margin-top:4px">
<button class="rb" style="background:#fff;color:#000;flex:1" onclick="showRank()">🏆 RANKING ALIVE</button>
<button class="rb" style="background:#FF0055;color:#fff;flex:1" onclick="resetG()">🔄 RESET ALIVE</button>
<button class="rb" style="background:#25D366;color:#fff;flex:1" onclick="shareW()">📲 SHARE ALIVE</button>
</div>
</div>
<div class="card"><div id="chat" style="height:60px;overflow-y:auto;background:#0008;border-radius:6px;padding:6px;font-size:11px">SYSTEM: All alive! No inactive!</div></div>
<input type="file" id="f" accept="image/*" style="display:none">
</div>
<div class="modal" id="rm"><div class="mcard">
<h3 style="color:#FFCC00">RANKING - ALL ALIVE</h3>
<div id="rc" style="margin-top:8px;text-align:left;font-size:12px"></div>
<div id="pun" style="margin-top:8px;background:#FF333322;border:2px solid #FF3333;border-radius:8px;padding:8px;font-size:11px"></div>
<button onclick="closeR()" style="margin-top:8px;width:100%;padding:10px;border-radius:8px;border:0;background:#333;color:#fff;font-weight:900;cursor:pointer">CLOSE - ALIVE</button>
</div></div>
<script>
var players=[],curr=0,rot=0,pend=-1,pendT='',ask=[],tmr=null,tl=0;
var LEVELS=['SOFT','TEEN','PARTY','SPICY','ADULT','SAVAGE'];var curL=2;
var Q={0:{t:["Embarrassing text?","Hidden talent?"],d:["15 jumping jacks"]},1:{t:["Who kiss now?"],d:["Text crush"]},2:{t:["Drunkest ever?","Body count?"],d:["Water shot"]},3:{t:["Biggest fantasy?"],d:["Lap dance 15s"]},4:{t:["Secret?"],d:["Twerk 30s"]},5:{t:["Who unfriend?"],d:["Post liar"]}};
var PUN=["Buys Rolex for all!","20 pushups shouting winner!","Post 'I lost Posi Posi!'","Dance Azonto 30s!","Call crush!"];
function tick(){try{document.getElementById('clk').textContent=new Date().toLocaleTimeString();}catch(e){}}
setInterval(tick,1000);tick();
function renderLv(){var h='';for(var i=0;i<LEVELS.length;i++){h+='<div style="padding:5px 10px;background:'+(i==curL?'#fff;color:#000':'#222')+';border-radius:99px;font-size:10px;font-weight:800;cursor:pointer" onclick="curL='+i+';renderLv()">'+LEVELS[i]+'</div>';}document.getElementById('lv').innerHTML=h;}
function render(){
var el=document.getElementById('plist');el.innerHTML='';var tot=0;
for(var i=0;i<players.length;i++){tot+=players[i].points;var s=document.createElement('span');s.innerHTML=players[i].name+' '+players[i].points+'pts <span style="background:#F33;padding:0 5px;border-radius:50%;cursor:pointer" onclick="players.splice('+i+',1);drawW();render()">x</span>';if(i==curr)s.style.background='#FFCC00';s.style.color='#000';el.appendChild(s);}
document.getElementById('pts').textContent=tot+' pts';
var b=document.getElementById('board');if(players.length==0){b.innerHTML='Add players!';return;}
var sorted=players.slice().sort(function(a,b){return b.points-a.points;});
var h='LEADERBOARD ALIVE<br>';for(var i=0;i<sorted.length;i++){h+='<div style="display:flex;justify-content:space-between"><span>'+(i+1)+'. '+sorted[i].name+'</span><span>'+sorted[i].points+' pts</span></div>';}
b.innerHTML=h;
}
function drawW(){
var w=document.getElementById('wheel');var ps=w.querySelectorAll('.p');for(var i=0;i<ps.length;i++)ps[i].remove();
if(players.length==0)return;
for(var i=0;i<players.length;i++){var d=document.createElement('div');d.className='p'+(i==curr?' on':'');d.textContent=players[i].name+' '+players[i].points;var a=(360/players.length)*i+90;var r=90;var x=Math.cos(a*Math.PI/180)*r;var y=Math.sin(a*Math.PI/180)*r;d.style.left='50%';d.style.top='50%';d.style.transform='translate(-50%,-50%) translate('+x+'px,'+y+'px)';w.appendChild(d);}
}
function addP(){
var v=document.getElementById('pn').value.trim();if(!v){alert('ADD ME ALIVE - Type name!');return;}
players.push({name:v,points:0});document.getElementById('pn').value='';drawW();render();addChat(v+' joined! ADD ME ALIVE WORKS!');
}
function spin(){
if(players.length<2){document.getElementById('qm').textContent='Need 2+ players! SPIN ALIVE but add players first!';return;}
var bot=document.getElementById('bot');var picked=Math.floor(Math.random()*players.length);
var finalRot=rot+5*360+Math.random()*360;bot.style.transform='rotate('+finalRot+'deg)';rot=finalRot;
document.getElementById('qm').textContent='SPINNING... SPIN ALIVE WORKS!';hideDec();stopT();
setTimeout(function(){curr=picked;drawW();document.getElementById('qm').innerHTML='🎯 '+players[curr].name+' PICKED! SPIN ALIVE WORKS!';},3000);
}
function getQ(list){
var av=[];for(var i=0;i<list.length;i++){if(ask.indexOf(list[i])==-1)av.push(list[i]);}
if(av.length==0){ask=[];av=list.slice();}
var q=av[Math.floor(Math.random()*av.length)];ask.push(q);return q;
}
function play(type){
if(players.length<2)return;
var q=getQ(Q[curL][type]);
pend=curr;pendT=type;var pts=type=='truth'?10:5;
document.getElementById('qm').innerHTML=LEVELS[curL]+' '+type+' '+pts+'pts<br><b>'+q+'</b><br>'+players[pend].name+' must answer! PLAY ALIVE!';
document.getElementById('dt').textContent='Did '+players[pend].name+' answer?';document.getElementById('dq').textContent=q;
document.getElementById('dec').className='dec show';addChat(type+' ALIVE! '+q);startT(type=='dare'?30:45);
}
function hideDec(){document.getElementById('dec').className='dec';}
function startT(s){stopT();tl=s;var el=document.getElementById('tm');el.className='timer show';el.textContent='⏱️ '+tl+'s TIMER ALIVE!';tmr=setInterval(function(){tl--;el.textContent='⏱️ '+tl+'s';if(tl<=0){stopT();el.textContent='⏱️ TIME UP! TIMER ALIVE!';}},1000);}
function stopT(){if(tmr){clearInterval(tmr);tmr=null;}document.getElementById('tm').className='timer';}
function award(){
if(pend<0){alert('AWARD ALIVE - Pick Truth/Dare first!');return;}
stopT();var pts=pendT=='truth'?10:5;players[pend].points+=pts;
document.getElementById('qm').innerHTML='🟢 AWARD ALIVE WORKS! '+players[pend].name+' +'+pts+' = '+players[pend].points;
hideDec();addChat('🟢 AWARD ALIVE! +'+pts);curr=(curr+1)%players.length;drawW();render();pend=-1;
}
function deduct(){
if(pend<0){alert('DEDUCT ALIVE - Pick Truth/Dare first!');return;}
stopT();players[pend].points+=-5;
document.getElementById('qm').innerHTML='🔴 DEDUCT ALIVE WORKS! '+players[pend].name+' -5 = '+players[pend].points;
hideDec();addChat('🔴 DEDUCT ALIVE! -5');curr=(curr+1)%players.length;drawW();render();pend=-1;
}
function skip(){
if(pend<0){alert('SKIP ALIVE - Pick Truth/Dare first!');return;}
stopT();players[pend].points+=-3;
document.getElementById('qm').innerHTML='⏭️ SKIP ALIVE WORKS! -3';hideDec();addChat('⏭️ SKIP ALIVE!');curr=(curr+1)%players.length;drawW();render();pend=-1;
}
function photo(){
var inp=document.getElementById('f');
inp.onchange=function(e){
var file=e.target.files[0];if(!file)return;
var r=new FileReader();
r.onload=function(ev){addChat('📸 PROOF ALIVE! <img src="'+ev.target.result+'" style="max-width:100%">');};
r.readAsDataURL(file);
};
inp.click();addChat('📸 PROOF ALIVE - Camera opening!');
}
function showRank(){
if(players.length==0){alert('RANKING ALIVE - Add players first!');return;}
var sorted=players.slice().sort(function(a,b){return b.points-a.points;});
var html='';for(var i=0;i<sorted.length;i++){html+='<div style="padding:6px;background:'+(i==0?'#FFCC00;color:#000':'#222')+';border-radius:6px;margin:3px 0;display:flex;justify-content:space-between"><span>'+(i+1)+'. '+sorted[i].name+'</span><span>'+sorted[i].points+' pts</span></div>';}
document.getElementById('rc').innerHTML=html;
document.getElementById('pun').innerHTML='😈 LOSER: '+sorted[sorted.length-1].name+' - '+PUN[Math.floor(Math.random()*PUN.length)]+' - PUNISHMENT ALIVE!';
document.getElementById('rm').className='modal show';addChat('🏆 RANKING ALIVE WORKS!');
}
function closeR(){document.getElementById('rm').className='modal';}
function resetG(){for(var i=0;i<players.length;i++)players[i].points=0;ask=[];drawW();render();document.getElementById('qm').textContent='RESET ALIVE WORKS! New game!';addChat('🔄 RESET ALIVE!');}
function shareW(){
if(players.length==0){alert('SHARE ALIVE - Add players!');return;}
var sorted=players.slice().sort(function(a,b){return b.points-a.points;});
var txt='🏆 TRUTH OR DARE!%0A';for(var i=0;i<sorted.length;i++){txt+=(i+1)+'. '+sorted[i].name+' '+sorted[i].points+' pts%0A';}
window.open('https://wa.me/?text='+txt,'_blank');addChat('📲 SHARE ALIVE WORKS!');
}
function addChat(t){var c=document.getElementById('chat');var d=document.createElement('div');d.innerHTML=t;c.appendChild(d);c.scrollTop=c.scrollHeight;}
renderLv();render();drawW();
</script>
</body></html>
