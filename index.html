<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>STABLE ULTRA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a14;color:#fff;font-family:system-ui;padding:12px}
.app{max-width:400px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
h1{text-align:center;font-size:28px}
h1 span{color:#FF0055}
.lv{display:flex;gap:5px;overflow-x:auto;padding:6px 0}
.lv div{flex:0 0 auto;padding:7px 12px;border-radius:99px;background:#222;font-size:11px;font-weight:700;cursor:pointer}
.lv div.on{background:#fff;color:#000}
.wheel{width:240px;height:240px;margin:10px auto;border-radius:50%;background:#1a1a2e;border:6px solid #FF005533;position:relative;display:flex;align-items:center;justify-content:center}
.bottle{font-size:60px;cursor:pointer;transition:transform 2s ease}
.p-dot{position:absolute;font-size:10px;font-weight:800;background:#333;padding:4px 8px;border-radius:99px}
.p-dot.on{background:#FFCC00;color:#000}
.card{background:#1c1c32;border-radius:16px;padding:12px}
.qbox{background:#0005;border-radius:12px;padding:12px;min-height:80px;text-align:center}
.btns{display:flex;gap:8px;margin-top:8px}
.btns button{flex:1;border:0;border-radius:10px;padding:12px;font-weight:900;cursor:pointer}
.t{background:#00D4FF;color:#000}.d{background:#FF0055;color:#fff}
.input{display:flex;gap:6px}
.input input{flex:1;background:#0005;border:1px solid #444;border-radius:8px;padding:10px;color:#fff}
.chat{height:120px;overflow-y:auto;background:#0004;border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:4px}
.m{background:#222;padding:6px 10px;border-radius:10px;font-size:12px;max-width:85%}
.m.me{align-self:flex-end;background:#fff;color:#000}
.react{display:flex;gap:6px;justify-content:center;font-size:22px;margin:6px 0}
.react span{cursor:pointer}
.cin{display:flex;gap:4px;margin-top:4px}
.cin input{flex:1;background:#222;border:1px solid #444;border-radius:99px;padding:8px 12px;color:#fff}
</style></head><body>
<div class="app">
<h1>TRUTH <span>OR DARE</span></h1>
<div style="text-align:center;font-size:10px;opacity:.6">STABLE • NO CRASH • ALL ACTIVE</div>
<div class="lv" id="lv"></div>
<div class="wheel" id="wheel"><div class="bottle" id="bot" onclick="spin()">🍾</div></div>
<div style="text-align:center;font-size:11px;opacity:.6">TAP BOTTLE - STABLE SPIN</div>
<div class="card">
<div class="input"><input id="pn" placeholder="Player name"><button onclick="addP()" style="background:#fff;color:#000;border:0;border-radius:8px;padding:8px 12px;font-weight:800">ADD</button></div>
<div class="qbox" id="qb">Add 2+ players → Spin bottle → Play! Stable version.</div>
<div class="react"><span onclick="react('😂')">😂</span><span onclick="react('🔥')">🔥</span><span onclick="react('😳')">😳</span><span onclick="react('💀')">💀</span><span onclick="react('😍')">😍</span></div>
<div class="btns"><button class="t" onclick="play('truth')">TRUTH</button><button class="d" onclick="play('dare')">DARE</button></div>
</div>
<div class="card">
<div style="font-weight:800;font-size:11px">💬 CHAT (STABLE)</div>
<div class="chat" id="chat"><div class="m">Chat works! Type below 👇</div></div>
<div class="cin"><input id="ci" placeholder="Message..."><button onclick="send()" style="background:#FF0055;border:0;border-radius:99px;width:36px;height:36px;color:#fff">➤</button><button onclick="rec()" style="background:#222;border:0;border-radius:99px;width:36px;height:36px">🎤</button></div>
</div>
</div>
<script>
let L=['SOFT','TEEN','PARTY','SPICY','ADULT','SAVAGE'],cur=2,players=[],curr=0,rot=0;
let Q={0:{t:["Embarrassing text?","Hidden talent?"],d:["Jumping jacks","Dance"]},1:{t:["Who kiss?","Attractive here?"],d:["Text crush","Stare 20s"]},2:{t:["Drunkest?","Body count?"],d:["Water shot","Dance chair"]},3:{t:["Fantasy?","Kinkiest?"],d:["Lap dance","Whisper dirty"]},4:{t:["Virginity how?","Dirtiest secret?","Fav position?","Body count?"],d:["Dirty text","Twerk","Moan name"]},5:{t:["Who unfriend?","Most illegal?"],d:["Post liar","Show bank"]}};
function renderLv(){let h='';L.forEach((n,i)=>{h+=`<div class="${i==cur?'on':''}" onclick="cur=${i};renderLv()">${n}</div>`});document.getElementById('lv').innerHTML=h}
function addP(){let v=document.getElementById('pn').value.trim();if(!v||players.length>=6)return;players.push(v);document.getElementById('pn').value='';drawWheel();addMsg(v+' joined','')}
function drawWheel(){let w=document.getElementById('wheel');w.querySelectorAll('.p-dot').forEach(e=>e.remove());players.forEach((p,i)=>{let d=document.createElement('div');d.className='p-dot'+(i==curr?' on':'');d.textContent=p;let a=(360/players.length)*i;let r=90;let x=Math.cos(a*Math.PI/180)*r;let y=Math.sin(a*Math.PI/180)*r;d.style.left='50%';d.style.top='50%';d.style.transform=`translate(-50%,-50%) translate(${x}px,${y}px)`;w.appendChild(d)})}
function spin(){if(players.length<2){document.getElementById('qb').innerText='Need 2 players!';return}let b=document.getElementById('bot');rot+=Math.floor(Math.random()*1000)+800;b.style.transform=`rotate(${rot}deg)`;setTimeout(()=>{curr=Math.floor(Math.random()*players.length);drawWheel();document.getElementById('qb').innerHTML=`<b>${players[curr]} 🎯 PICKED!</b><br>Now hit Truth or Dare`;addMsg('Wheel picked '+players[curr]+'!','')},2000)}
function play(t){if(players.length<2)return;let list=t=='truth'?Q[cur].t:Q[cur].d;let q=list[Math.floor(Math.random()*list.length)];document.getElementById('qb').innerHTML=`<div style="opacity:.6;font-size:10px">${L[cur]} ${t}</div><div style="font-weight:800;margin-top:6px">${q}</div><div style="margin-top:6px">👉 ${players[curr]}</div>`;addMsg(players[curr]+' - '+t+': '+q,'');curr=(curr+1)%players.length;setTimeout(drawWheel,200)}
function react(e){addMsg('Reacted '+e,'');let f=document.createElement('div');f.style.position='fixed';f.style.left='50%';f.style.top='60%';f.style.fontSize='30px';f.textContent=e;f.style.animation='up 1s forwards';document.body.appendChild(f);setTimeout(()=>f.remove(),1000)}
function send(){let i=document.getElementById('ci');let v=i.value.trim();if(!v)return;addMsg(v,'me');i.value=''}
function addMsg(t,me){let c=document.getElementById('chat');let d=document.createElement('div');d.className='m '+(me?'me':'');d.textContent=t;c.appendChild(d);c.scrollTop=c.scrollHeight}
function rec(){let v=prompt('Type voice message as text (stable mode) - audio needs HTTPS, so type it:');if(v)addMsg('🎤 '+v,'me')}
document.getElementById('pn').addEventListener('keydown',e=>{if(e.key=='Enter')addP()});
document.getElementById('ci').addEventListener('keydown',e=>{if(e.key=='Enter')send()});
renderLv();
</script>
<style>@keyframes up{to{transform:translateY(-100px);opacity:0}}</style>
</body></html>
