<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRUTH OR DARE SOCIAL ULTRA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#08080f;color:#fff;font-family:system-ui;min-height:100vh}
.app{max-width:500px;margin:0 auto;padding:14px;display:flex;flex-direction:column;min-height:100vh;gap:12px}
.header{text-align:center}.logo{font-size:34px;font-weight:900}.logo span{background:linear-gradient(90deg,#FF0055,#FFCC00);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.levels{display:flex;gap:6px;overflow-x:auto}.level{flex:0 0 auto;padding:8px 12px;border-radius:99px;background:#ffffff0a;border:1px solid #ffffff15;font-size:11px;font-weight:700;cursor:pointer}.level.active{background:#fff;color:#000}
.wheel-box{position:relative;width:280px;height:280px;margin:10px auto;border-radius:50%;background:conic-gradient(#FF0055,#FFCC00,#00D4FF,#7C3AED,#FF0055);padding:6px;transition:transform 4s cubic-bezier(.15,.8,.2,1)}
.wheel-inner{width:100%;height:100%;background:#141428;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.player-on-wheel{position:absolute;font-size:11px;font-weight:800;background:#ffffff18;padding:3px 7px;border-radius:99px;transform-origin:center}
.bottle-center{font-size:64px;z-index:2;cursor:pointer;filter:drop-shadow(0 0 15px #FF0055)}
.card{background:linear-gradient(180deg,#1c1c32,#141428);border-radius:22px;padding:16px;border:1px solid #ffffff12}
.qbox{background:#0006;border-radius:16px;padding:14px;min-height:90px;text-align:center}
.btn-row{display:flex;gap:8px;margin-top:10px}.btn{flex:1;border:0;border-radius:12px;padding:12px;font-weight:900;cursor:pointer}.btn-t{background:linear-gradient(135deg,#00D4FF,#5B5BFF);color:#fff}.btn-d{background:linear-gradient(135deg,#FF0055,#FF3D00);color:#fff}
.input{display:flex;gap:6px}.input input{flex:1;background:#0005;border:1px solid #ffffff18;border-radius:10px;padding:10px;color:#fff}
.reactions{display:flex;gap:6px;justify-content:center;margin:8px 0}.react{font-size:22px;cursor:pointer;transition:.2s}.react:hover{transform:scale(1.4)}
.chat{max-height:180px;overflow-y:auto;background:#00000055;border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px}
.msg{background:#ffffff10;padding:6px 10px;border-radius:12px;font-size:13px;max-width:80%}.msg.me{align-self:flex-end;background:linear-gradient(135deg,#FF0055,#FFCC00);color:#000;font-weight:600}
.chat-input{display:flex;gap:6px}.chat-input input{flex:1;background:#ffffff0f;border:1px solid #ffffff15;border-radius:99px;padding:10px 14px;color:#fff}
.icon-btn{background:#ffffff14;border:0;border-radius:99px;width:40px;height:40px;cursor:pointer;font-size:18px}
.float{position:fixed;pointer-events:none;animation:floatUp 2s ease forwards;font-size:24px}
@keyframes floatUp{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-120px) scale(1.5);opacity:0}}
</style></head><body>
<div class="app">
<div class="header"><div class="logo">TRUTH <span>OR DARE</span></div><div style="font-size:9px;letter-spacing:3px;opacity:.5">WHEEL • CHAT • VOICE • REACTIONS</div></div>
<div class="levels" id="levels"></div>
<div class="wheel-box" id="wheelBox"><div class="wheel-inner" id="wheelInner"><div class="bottle-center" id="bottle" onclick="spinWheel()">🍾</div></div></div>
<div style="text-align:center;font-size:11px;opacity:.6">TAP BOTTLE TO SPIN WHEEL</div>
<div class="card">
<div class="input"><input id="pname" placeholder="Add player"><button class="btn" style="background:#fff;color:#000;padding:8px 14px" onclick="addPlayer()">ADD</button></div>
<div class="qbox" id="qbox"><div style="opacity:.6;font-size:11px">READY?</div><div style="font-weight:700;margin-top:4px">Add players, spin wheel!</div></div>
<div class="reactions" id="reacts"><div class="react" onclick="react('😂')">😂</div><div class="react" onclick="react('🔥')">🔥</div><div class="react" onclick="react('😳')">😳</div><div class="react" onclick="react('💀')">💀</div><div class="react" onclick="react('😍')">😍</div><div class="react" onclick="react('🤮')">🤮</div></div>
<div class="btn-row"><button class="btn btn-t" onclick="play('truth')">TRUTH 💎</button><button class="btn btn-d" onclick="play('dare')">DARE 🔥</button></div>
</div>
<div class="card">
<div style="font-size:12px;font-weight:700;margin-bottom:6px">💬 GROUP CHAT + VOICE</div>
<div class="chat" id="chat"></div>
<div class="chat-input"><input id="chatIn" placeholder="Type message..."><button class="icon-btn" onclick="sendChat()">
